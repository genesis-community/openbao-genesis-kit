exodus:
  bosh: some-other-env
  ca: <!{meta.vault}/certs/ca:certificate!>
  domain: test.domain.com
  features: ""
  iaas: aws
  ips: 10.1.1.0,10.1.1.1,10.1.1.2,10.1.1.3,10.1.1.4
  is_director: false
  scale: null
  services: vault
  url: https://10.1.1.0
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 5
  jobs:
  - name: openbao
    properties:
      openbao:
        default_lease_ttl: 1000h
        log_level: debug
        max_lease_ttl: 2000h
        peer:
          tls:
            ca: <!{meta.vault}/certs/ca:certificate!>
            certificate: <!{meta.vault}/certs/peer:certificate!>
            key: <!{meta.vault}/certs/peer:key!>
            servername: test.domain.com
        tls:
          certificate: <!{meta.vault}/certs/vault:certificate!>
          key: <!{meta.vault}/certs/vault:key!>
        ui: false
    release: openbao
  - name: bpm
    release: bpm
  name: openbao
  networks:
  - name: test-network
    static_ips:
    - 10.1.1.0
    - 10.1.1.1
    - 10.1.1.2
    - 10.1.1.3
    - 10.1.1.4
  persistent_disk_type: test-disk-type
  stemcell: default
  vm_type: test-vm-type
name: base-all-params-openbao
releases:
- name: openbao
  sha1: sha256:5efad4911792e7037545b69522877d60ecc3ff032623b5b82806c98d639986af
  url: https://github.com/cloudfoundry-community/openbao-boshrelease/releases/download/v0.3.3/openbao-0.3.3.tgz
  version: 0.3.3
- name: bpm
  sha1: sha256:51f2eab4b59939db733beb8f7905e461a732cc29d85e54f151f576cd5bf0c414
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.22
  version: 1.4.22
stemcells:
- alias: default
  os: test-stemcell
  version: 9.9.9
update:
  canaries: 1
  canary_watch_time: 30000-120000
  max_in_flight: 1
  serial: true
  update_watch_time: 30000-120000
