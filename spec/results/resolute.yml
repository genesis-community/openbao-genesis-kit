exodus:
  bosh: resolute
  ca: <!{meta.vault}/certs/ca:certificate!>
  domain: openbao.bosh
  features: resolute
  iaas: null
  ips:
  - 10.99.0.16
  - 10.99.0.17
  - 10.99.0.18
  is_director: false
  scale: null
  services: vault
  url: https://10.99.0.16
  use_create_env: false
instance_groups:
- azs:
  - z1
  - z2
  - z3
  instances: 3
  jobs:
  - name: openbao
    properties:
      openbao:
        default_lease_ttl: 768h
        log_level: info
        max_lease_ttl: 768h
        peer:
          tls:
            ca: <!{meta.vault}/certs/ca:certificate!>
            certificate: <!{meta.vault}/certs/peer:certificate!>
            key: <!{meta.vault}/certs/peer:key!>
            servername: openbao.bosh
        seal:
          type: shamir
        tls:
          certificate: <!{meta.vault}/certs/vault:certificate!>
          key: <!{meta.vault}/certs/vault:key!>
        ui: true
    release: openbao
  - name: bpm
    release: bpm
  name: openbao
  networks:
  - name: openbao
    static_ips:
    - 10.99.0.16
    - 10.99.0.17
    - 10.99.0.18
  persistent_disk_type: default
  stemcell: default
  vm_type: default
name: resolute-openbao
releases:
- name: openbao
  sha1: sha256:133518349444fdbb0bf57f90d47ab0f7e0364cebf90948f6188699d03d885881
  url: https://github.com/cloudfoundry-community/openbao-boshrelease/releases/download/v0.5.0/openbao-0.5.0.tgz
  version: 0.5.0
- name: bpm
  sha1: sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
  version: 1.4.41
stemcells:
- alias: default
  os: ubuntu-resolute
  version: "0.184"
update:
  canaries: 1
  canary_watch_time: 30000-120000
  max_in_flight: 1
  serial: true
  update_watch_time: 30000-120000
